<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kya Karein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --display: 'Fredoka', 'Trebuchet MS', sans-serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--body);
    color: #fff;
    background: #1b0f3a;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- Mood backgrounds: stacked layers cross-fade over 1s ---- */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    opacity: 0; transition: opacity 1s ease;
  }
  .bg.active { opacity: 1; }
  .bg-default  { background: linear-gradient(135deg, #5b21b6 0%, #a21caf 55%, #db2777 100%); }
  .bg-low      { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1d4ed8 100%); }
  .bg-happy    { background: linear-gradient(135deg, #f97316 0%, #ec4899 60%, #f43f5e 100%); }
  .bg-bored    { background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 40%, #0d9488 100%); }
  .bg-anxious  { background: linear-gradient(135deg, #3f9b7a 0%, #6ec7a4 55%, #b6ecd3 100%); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px;
  }
  .logo {
    font-family: var(--display); font-weight: 700; font-size: 1.9rem;
    letter-spacing: .5px; display: flex; align-items: center; gap: 10px;
  }
  .logo .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #fde047;
    box-shadow: 0 0 0 0 rgba(253,224,71,.7);
    animation: ping 2s infinite;
  }
  #reset {
    font-family: var(--body); font-weight: 600; font-size: .8rem;
    color: #fff; background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background .2s, transform .2s;
  }
  #reset:hover { background: rgba(255,255,255,.3); transform: translateY(-1px); }

  main { max-width: 1280px; margin: 0 auto; padding: 0 32px 64px; }

  /* ---- Empty state ---- */
  #empty {
    min-height: 68vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px;
  }
  #empty h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.2rem, 5.5vw, 4.4rem); line-height: 1.08;
    margin: 18px 0 0; max-width: 16ch;
    text-shadow: 0 4px 24px rgba(0,0,0,.25);
  }
  #empty p.sub { font-size: clamp(1rem, 1.8vw, 1.3rem); opacity: .88; margin: 0; }
  #empty p.call {
    margin: 10px 0 0; font-family: var(--display); font-weight: 600; font-size: 1.3rem;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    padding: 10px 22px; border-radius: 999px;
  }

  .mic {
    position: relative; width: 96px; height: 96px; border-radius: 50%;
    background: #fff; color: #7c3aed; display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .mic::before, .mic::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8);
    animation: pulse 2.4s ease-out infinite;
  }
  .mic::after { animation-delay: 1.2s; }
  .mic svg { width: 44px; height: 44px; }

  .wave { display: flex; gap: 6px; align-items: center; height: 46px; margin-top: 6px; }
  .wave span {
    width: 6px; border-radius: 3px; background: rgba(255,255,255,.9);
    height: 12px; animation: wave 1.1s ease-in-out infinite;
  }
  .wave span:nth-child(2) { animation-delay: .1s; }
  .wave span:nth-child(3) { animation-delay: .2s; }
  .wave span:nth-child(4) { animation-delay: .3s; }
  .wave span:nth-child(5) { animation-delay: .4s; }
  .wave span:nth-child(6) { animation-delay: .5s; }
  .wave span:nth-child(7) { animation-delay: .6s; }

  /* ---- Picks ---- */
  #picks { display: none; }
  .quote {
    font-family: var(--display); font-weight: 600;
    font-size: clamp(1.7rem, 3.6vw, 3rem); line-height: 1.2;
    margin: 8px auto 18px; max-width: 26ch; text-align: center;
    text-shadow: 0 3px 20px rgba(0,0,0,.25);
    animation: fadeUp .6s ease both;
  }
  .quote::before { content: "\201C"; }
  .quote::after  { content: "\201D"; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 34px; }
  .tag {
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
    padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem;
    backdrop-filter: blur(6px); animation: fadeUp .5s ease both;
  }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px)  { .grid { grid-template-columns: 1fr; } main { padding: 0 18px 48px; } header { padding: 16px 18px; } }

  .card {
    background: rgba(255,255,255,.96); color: #1f1b2e; border-radius: 22px;
    padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,.28);
    opacity: 0; animation: cardIn .6s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  .kind {
    align-self: flex-start; font-family: var(--display); font-weight: 600;
    font-size: .8rem; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 999px; color: #fff; background: #7c3aed;
  }
  .kind.Book  { background: #f97316; }
  .kind.Movie { background: #ec4899; }
  .kind.Show  { background: #0ea5e9; }
  .kind.Game  { background: #10b981; }

  .poster {
    width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden;
    background: #ddd; position: relative;
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph {
    width: 100%; height: 100%; display: grid; place-items: center; padding: 18px;
    text-align: center; font-family: var(--display); font-weight: 700;
    font-size: 1.6rem; line-height: 1.15; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.3); word-break: break-word;
  }
  .card h3 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; margin: 2px 0 0; line-height: 1.2; }
  .card h3 .yr { font-family: var(--body); font-weight: 500; font-size: .9rem; color: #7b7690; margin-left: 4px; }
  .author { font-size: .92rem; color: #5b5675; font-weight: 500; margin-top: -4px; }
  .why { font-style: italic; font-size: .95rem; line-height: 1.4; color: #3b3650; margin: 0; flex: 1; }
  .open {
    align-self: flex-start; text-decoration: none; color: #fff; background: #1f1b2e;
    font-weight: 600; font-size: .85rem; padding: 8px 16px; border-radius: 999px;
    transition: transform .2s, background .2s;
  }
  .open:hover { background: #7c3aed; transform: translateY(-1px); }

  /* ---- Keyframes ---- */
  @keyframes ping { 70% { box-shadow: 0 0 0 12px rgba(253,224,71,0); } 100% { box-shadow: 0 0 0 0 rgba(253,224,71,0); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 44px; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.94); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg bg-default active" data-theme="default"></div>
  <div class="bg bg-low" data-theme="low"></div>
  <div class="bg bg-happy" data-theme="happy"></div>
  <div class="bg bg-bored" data-theme="bored"></div>
  <div class="bg bg-anxious" data-theme="anxious"></div>

  <header>
    <div class="logo"><span class="dot"></span>Kya Karein</div>
    <button id="reset" type="button">Reset</button>
  </header>

  <main>
    <section id="empty">
      <div class="mic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </div>
      <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <h1>Call Kya Karein and tell it about your day</h1>
      <p class="sub">Your picks will appear here while you talk</p>
      <p class="call">Call: PHONE_NUMBER_HERE</p>
    </section>

    <section id="picks">
      <div class="quote" id="quote"></div>
      <div class="tags" id="tags"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

<script>
(function () {
  var lastVersion = null;
  var emptyEl = document.getElementById('empty');
  var picksEl = document.getElementById('picks');
  var quoteEl = document.getElementById('quote');
  var tagsEl = document.getElementById('tags');
  var gridEl = document.getElementById('grid');

  var THEMES = [
    ['low',     /\b(tired|sad|low|lonely|exhausted|down|drained)\b/],
    ['happy',   /\b(happy|excited|celebrate|celebrating|celebration|joyful|great)\b/],
    ['bored',   /\b(bored|boring|boredom)\b/],
    ['anxious', /\b(anxious|anxiety|stressed|stress|overwhelmed|nervous|worried)\b/]
  ];

  function setTheme(text) {
    var t = (text || '').toLowerCase(), theme = 'default';
    for (var i = 0; i < THEMES.length; i++) {
      if (THEMES[i][1].test(t)) { theme = THEMES[i][0]; break; }
    }
    document.querySelectorAll('.bg').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-theme') === theme);
    });
  }

  function hue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function makePlaceholder(title) {
    var h = hue(title || 'x');
    var ph = el('div', 'ph', title || '');
    ph.style.background = 'linear-gradient(145deg, hsl(' + h + ',80%,55%), hsl(' + ((h + 60) % 360) + ',80%,45%))';
    return ph;
  }

  function makeCard(p, i) {
    var card = el('article', 'card');
    card.style.animationDelay = (i * 150) + 'ms';

    card.appendChild(el('span', 'kind ' + p.kind, p.kind));

    var poster = el('div', 'poster');
    if (p.image) {
      var img = document.createElement('img');
      img.alt = p.title + ' poster';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onerror = function () {
        poster.innerHTML = '';
        poster.appendChild(makePlaceholder(p.title));
      };
      img.src = p.image;
      poster.appendChild(img);
    } else {
      poster.appendChild(makePlaceholder(p.title));
    }
    card.appendChild(poster);

    var h3 = el('h3', null, p.title);
    if (p.year) h3.appendChild(el('span', 'yr', '(' + p.year + ')'));
    card.appendChild(h3);

    if (p.kind === 'Book' && p.author) card.appendChild(el('div', 'author', 'by ' + p.author));
    if (p.why) card.appendChild(el('p', 'why', p.why));

    if (p.link) {
      var a = el('a', 'open', 'Open');
      a.href = p.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    return card;
  }

  function render(data) {
    var picks = data.picks || [];
    if (!picks.length) {
      picksEl.style.display = 'none';
      emptyEl.style.display = 'flex';
      setTheme('');
      return;
    }
    emptyEl.style.display = 'none';
    picksEl.style.display = 'block';

    quoteEl.textContent = data.mood || '';
    quoteEl.style.display = data.mood ? 'block' : 'none';
    // restart quote animation
    quoteEl.style.animation = 'none'; void quoteEl.offsetWidth; quoteEl.style.animation = '';

    tagsEl.innerHTML = '';
    (data.tags || []).forEach(function (t, i) {
      var pill = el('span', 'tag', t);
      pill.style.animationDelay = (i * 60) + 'ms';
      tagsEl.appendChild(pill);
    });

    gridEl.innerHTML = '';
    picks.forEach(function (p, i) { gridEl.appendChild(makeCard(p, i)); });

    setTheme((data.mood || '') + ' ' + (data.tags || []).join(' '));
  }

  function poll() {
    fetch('/api/latest', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.version !== lastVersion) {
          lastVersion = data.version;
          render(data);
        }
      })
      .catch(function () { /* server hiccup: try again next tick */ });
  }

  document.getElementById('reset').addEventListener('click', function () {
    fetch('/api/reset', { method: 'POST' }).then(poll).catch(function () {});
  });

  poll();
  setInterval(poll, 1500);
})();
</script>
</body>
</html>
